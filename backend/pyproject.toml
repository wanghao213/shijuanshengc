[project]
name = "mathpaperforge-backend"
version = "1.0.0"
description = "MathPaperForge - 数学试卷智能生成系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "arq>=0.25.0",
    "litellm>=1.50.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in function arguments
    "E712",   # == True/False in SQLAlchemy filters
    "E501",   # Line too long (handled by formatter)
    "F401",   # Unused imports in __init__.py re-exports
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]  # SQLAlchemy forward references

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
